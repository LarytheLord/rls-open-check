name: pack-install
# Proves the packed tarball installs and runs on a clean machine, the way
# `npx rls-open-check` does for a user.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pack-install:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Pack
        shell: bash
        run: |
          npm pack --silent
          ls -l ./*.tgz
      - name: Install the tarball in an empty directory and run it
        shell: bash
        run: |
          set -u
          TGZ="$(pwd)/$(ls rls-open-check-*.tgz | head -n 1)"
          if command -v cygpath >/dev/null 2>&1; then TGZ="$(cygpath -m "$TGZ")"; fi
          echo "tarball: $TGZ"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "$TGZ"
          echo 'create table public.notes (id int);' > t.sql
          set +e
          npx rls-open-check t.sql > out.txt 2> err.txt
          CODE=$?
          set -e
          echo "exit code: $CODE"
          echo "--- stdout"; cat out.txt
          echo "--- stderr"; cat err.txt
          if [ "$CODE" -ne 1 ]; then echo "expected exit code 1"; exit 1; fi
          if ! grep -q "R1" out.txt; then echo "expected R1 in stdout"; exit 1; fi
