name: False positive
description: Report a finding that should not be reported.
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: R1
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: Minimal SQL
      description: Provide the smallest SQL example that reproduces the finding.
      render: sql
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rls-open-check version
    validations:
      required: true
